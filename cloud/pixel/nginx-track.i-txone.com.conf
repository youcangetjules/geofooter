# Stage 2: HTTPS for track.i-txone.com, proxied to the loopback pixel service.
# Self-contained: its own server_name, rate/connection-limit zones and log files.
#
# Install as /etc/nginx/sites-enabled/zz-aes-pixel so it is included AFTER
# workflow-api. workflow-api has no default_server, so whichever server block
# comes first on a socket is the catch-all for unknown Host/SNI and requests by
# IP; that must stay workflow-api.
# Listen directives must match workflow-api's exactly (IPv4 only, no
# default_server) so no new socket is opened.
limit_req_zone $binary_remote_addr zone=aes_pixel:1m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=aes_pixel_conn:1m;

server {
    listen 80;
    server_name track.i-txone.com;

    location /.well-known/acme-challenge/ {
        root /var/www/aes-pixel-acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name track.i-txone.com;

    ssl_certificate     /etc/letsencrypt/live/track.i-txone.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/track.i-txone.com/privkey.pem;

    access_log /var/log/nginx/aes-pixel.access.log;
    error_log  /var/log/nginx/aes-pixel.error.log;

    limit_conn aes_pixel_conn 10;

    location ~ ^/(p/|opens$|healthz$) {
        limit_req zone=aes_pixel burst=20 nodelay;
        proxy_pass http://127.0.0.1:8791;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    location / {
        return 404;
    }
}
