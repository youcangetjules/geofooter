# Stage 1: HTTP only, so certbot --webroot can validate track.i-txone.com.
#
# Install as /etc/nginx/sites-enabled/zz-aes-pixel so it is included AFTER
# workflow-api. workflow-api has no default_server, so whichever server block
# comes first on a socket is the catch-all for unknown Host headers and
# requests by IP; that must stay workflow-api.
# Listen directives must match workflow-api's exactly (IPv4 only, no
# default_server) so no new socket is opened.
server {
    listen 80;
    server_name track.i-txone.com;

    location /.well-known/acme-challenge/ {
        root /var/www/aes-pixel-acme;
    }

    location / {
        return 404;
    }
}
