# Stage 1: HTTP only, so certbot --webroot can validate track.aliniant.com.
# Self-contained server block; no other site is affected.
server {
    listen 80;
    listen [::]:80;
    server_name track.aliniant.com;

    location /.well-known/acme-challenge/ {
        root /var/www/aes-pixel-acme;
    }

    location / {
        return 404;
    }
}
