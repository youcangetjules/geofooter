# Stage 2: HTTPS for track.aliniant.com, proxied to the loopback pixel service.
# Self-contained: its own server_name, rate-limit zone and log files.
limit_req_zone $binary_remote_addr zone=aes_pixel:1m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name track.aliniant.com;

    location /.well-known/acme-challenge/ {
        root /var/www/aes-pixel-acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name track.aliniant.com;

    ssl_certificate     /etc/letsencrypt/live/track.aliniant.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/track.aliniant.com/privkey.pem;

    access_log /var/log/nginx/aes-pixel.access.log;
    error_log  /var/log/nginx/aes-pixel.error.log;

    location ~ ^/(p/|opens$|healthz$) {
        limit_req zone=aes_pixel burst=20 nodelay;
        proxy_pass http://127.0.0.1:8791;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    location / {
        return 404;
    }
}
