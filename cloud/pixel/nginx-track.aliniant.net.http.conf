# Stage 1: HTTP only, so certbot --webroot can validate track.aliniant.net.
#
# Installed by deploy.sh as sites-available/aes-pixel, enabled as
# sites-enabled/zz-aes-pixel so it loads after any other site on the VM and is
# never the catch-all for names it does not serve. If other sites are added
# to that VM later, give them their own server blocks; this one only answers
# its own name.
server {
    listen 80;
    server_name track.aliniant.net;

    location /.well-known/acme-challenge/ {
        root /var/www/aes-pixel-acme;
    }

    location / {
        return 404;
    }
}
