# Stage 2: static holding page for aliniant.net; www redirects to the bare name.
#
# Installed by deploy.sh as sites-available/aliniant-net, enabled as
# sites-enabled/zz-aliniant-net so it loads after any other site on the VM and
# is never the catch-all for names it does not serve.
limit_req_zone $binary_remote_addr zone=aliniant_net:1m rate=20r/s;

server {
    listen 80;
    server_name aliniant.net www.aliniant.net;

    location /.well-known/acme-challenge/ {
        root /var/www/aliniant-net-acme;
    }

    location / {
        return 301 https://aliniant.net$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.aliniant.net;

    ssl_certificate     /etc/letsencrypt/live/aliniant.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aliniant.net/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/aliniant-net.access.log;
    error_log  /var/log/nginx/aliniant-net.error.log;

    return 301 https://aliniant.net$request_uri;
}

server {
    listen 443 ssl;
    server_name aliniant.net;

    ssl_certificate     /etc/letsencrypt/live/aliniant.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aliniant.net/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/aliniant-net.access.log;
    error_log  /var/log/nginx/aliniant-net.error.log;

    root /var/www/aliniant-net;
    index index.html;

    limit_req zone=aliniant_net burst=40 nodelay;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    location = / {
        try_files /index.html =404;
    }

    location ~ ^/(aliniant-shire\.jpg|favicon\.ico)$ {
        expires 7d;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
