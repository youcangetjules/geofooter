name: Python Package using Conda

on:
  push:
  pull_request:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: geofooter
          environment-file: environment.yml
          python-version: "3.11"
          auto-activate-base: false
          channels: conda-forge
          channel-priority: strict

      - name: Lint critical errors (flake8)
        run: |
          flake8 aes guri aura geofooter scripts tests \
            --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 aes guri aura geofooter scripts tests \
            --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Package smoke tests
        run: |
          pytest tests/test_ci_smoke.py -q
