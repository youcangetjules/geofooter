# Stage 1: HTTP only, so certbot --webroot can validate aliniant.net and
# www.aliniant.net.
#
# Installed by deploy.sh as sites-available/aliniant-net, enabled as
# sites-enabled/zz-aliniant-net so it loads after any other site on the VM and
# is never the catch-all for names it does not serve.
server {
    listen 80;
    server_name aliniant.net www.aliniant.net;

    location /.well-known/acme-challenge/ {
        root /var/www/aliniant-net-acme;
    }

    location / {
        return 404;
    }
}
