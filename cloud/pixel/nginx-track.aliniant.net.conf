# Stage 2: HTTPS for track.aliniant.net, proxied to the loopback pixel service.
# Self-contained: its own server_name, rate/connection-limit zones and log files.
#
# Runs on the dedicated Aliniant VM, installed as
# /etc/nginx/sites-available/aes-pixel by deploy.sh.
limit_req_zone $binary_remote_addr zone=aes_pixel:1m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=aes_pixel_conn:1m;

server {
    listen 80;
    server_name track.aliniant.net;

    location /.well-known/acme-challenge/ {
        root /var/www/aes-pixel-acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name track.aliniant.net;

    ssl_certificate     /etc/letsencrypt/live/track.aliniant.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/track.aliniant.net/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/aes-pixel.access.log;
    error_log  /var/log/nginx/aes-pixel.error.log;

    limit_conn aes_pixel_conn 10;

    location ~ ^/(p/|opens$|healthz$) {
        limit_req zone=aes_pixel burst=20 nodelay;
        proxy_pass http://127.0.0.1:8791;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    location / {
        return 404;
    }
}
