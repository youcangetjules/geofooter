# Stage 1: HTTP only, so certbot --webroot can validate track.aliniant.net.
#
# Runs on the dedicated Aliniant VM, installed as
# /etc/nginx/sites-available/aes-pixel by deploy.sh. If other sites are added
# to that VM later, give them their own server blocks; this one only answers
# its own name.
server {
    listen 80;
    server_name track.aliniant.net;

    location /.well-known/acme-challenge/ {
        root /var/www/aes-pixel-acme;
    }

    location / {
        return 404;
    }
}
